<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Learning Fresher | Let's Build an LLM</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="stars" aria-hidden="true"></div>
    <aside class="mission-panel">
      <header class="brand">
        <span class="brand-mark">LF</span>
        <div>
          <h1>Learning Fresher</h1>
          <p>LLM pipeline drill cockpit</p>
        </div>
      </header>

      <section class="control-block">
        <label class="field">
          <span>Search Signal</span>
          <input id="searchInput" type="search" placeholder="stage / keyword / answer" />
        </label>

        <label class="field">
          <span>Pipeline Stage</span>
          <select id="stageFilter">
            <option value="all">All stages</option>
          </select>
        </label>

        <div class="toggle-grid">
          <label>
            <input id="wrongOnly" type="checkbox" />
            <span>Wrong only</span>
          </label>
          <label>
            <input id="shuffleMode" type="checkbox" />
            <span>Shuffle</span>
          </label>
        </div>
      </section>

      <section class="telemetry" aria-label="学习进度">
        <div>
          <strong id="doneCount">0</strong>
          <span>Answered</span>
        </div>
        <div>
          <strong id="rightCount">0</strong>
          <span>Correct</span>
        </div>
        <div>
          <strong id="accuracy">0%</strong>
          <span>Accuracy</span>
        </div>
      </section>

      <section class="progress-card">
        <div class="progress-top">
          <span>Mission progress</span>
          <strong id="learningPercent">0%</strong>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span id="learningBar"></span>
        </div>
        <p id="learningText">0 / 0 signals calibrated</p>
      </section>

      <section class="stage-radar">
        <div class="section-head">
          <span>Weakness Radar</span>
          <button id="exportWrong" type="button">Export</button>
        </div>
        <div id="stageRadarList" class="radar-list"></div>
      </section>

      <button id="resetProgress" class="reset-button" type="button">Reset local progress</button>
    </aside>

    <main class="cockpit">
      <header class="topbar">
        <div>
          <p id="missionMeta" class="eyebrow">Mission initializing</p>
          <h2 id="missionTitle">10-Signal Fresher Drill</h2>
        </div>
        <nav class="pager" aria-label="任务组导航">
          <button id="prevBatch" type="button" aria-label="上一组">‹</button>
          <span id="pageText">0 / 0</span>
          <button id="nextBatch" type="button" aria-label="下一组">›</button>
        </nav>
      </header>

      <section class="mission-card">
        <div class="batch-head">
          <div>
            <span id="batchTag" class="tag">Batch 01</span>
            <p id="batchHint">Complete 10 questions before submitting.</p>
          </div>
          <strong id="batchAnswered">0 / 10</strong>
        </div>

        <div id="questionGrid" class="question-grid"></div>
        <div id="batchResult" class="batch-result" hidden></div>

        <div class="card-actions">
          <button id="revealBatch" class="secondary" type="button">Reveal</button>
          <button id="submitBatch" class="primary" type="button">Submit Batch</button>
          <button id="nextAfterBatch" class="primary" type="button">Next Batch</button>
        </div>
      </section>
    </main>

    <script src="./data.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
